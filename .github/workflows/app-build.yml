name: App build, tests and screenshots

# The app is written on a machine with no Mac and no iPhone. This is what stops
# "the UI is built" from resting entirely on the fact that it compiles — which is
# precisely the claim PF-11 is about.
#
# Three things run here:
#   1. the shared Swift is regenerated from the Python engine and must not change,
#   2. the ported behaviour and safety tests run on the Simulator,
#   3. the app is launched with a seeded library, screenshotted, and each screen is
#      also dumped as text so it can be READ in the log rather than only looked at.
#
# None of it is a device result. The Simulator has no thermal state, no battery, no
# jetsam, no Neural Engine and no real photo library (P-02, PF-01).

# MANUAL ONLY. macOS runners bill at ten times the Linux rate on a private repository
# and the budget ran out running this on every push. The platform-independent half is
# verified continuously by swift-core.yml on Linux; this is spent deliberately, when
# there is a reason to check the UI, the PhotoKit path or the Vision signals.
on:
  workflow_dispatch:

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15          # standard arm64 runner. Do NOT switch to -large/-xlarge.
    # 20, not 45. The UI screenshot suite hangs unpredictably on this runner image —
    # it completed in four minutes once and then ran past thirty on the next attempt
    # with no code change between them — and a hang costs the full timeout at ten times
    # the Linux rate. The per-test allowance below caps a slow *test*; it does not cap a
    # stuck app launch, which is what this appears to be. Twenty minutes is generous for
    # a suite whose one good run took four.
    timeout-minutes: 20

    env:
      XCODE_VERSION: '16.4'
      SCHEME: PVM
      PROJECT_DIR: 40_APP

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The taxonomy and the rules are generated from the engine. Maintained by hand
      # they diverge silently, and every number measured on the engine stops describing
      # the product.
      - name: Shared Swift still matches the Python engine
        run: python 40_APP/generate_shared.py --check

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate --spec project.yml

      # `xcrun simctl list` hangs outright when CoreSimulator's service is wedged, and
      # a hung step does not fail — it runs until the 45-minute job timeout on a runner
      # billed at ten times the Linux rate. That happened: this step sat for sixteen
      # minutes on a call that normally takes nine seconds, and had to be cancelled by
      # hand. So the call gets a two-minute budget, and one retry after restarting the
      # service, which is the standard remedy for exactly this.
      - name: Pick a simulator
        id: sim
        run: |
          python3 - <<'PICK' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys, time

          def pick():
              out = subprocess.run(["xcrun", "simctl", "list", "devices", "available",
                                    "--json"],
                                   capture_output=True, text=True, timeout=120)
              devices = json.loads(out.stdout)["devices"]
              for runtime, entries in sorted(devices.items(), reverse=True):
                  if "iOS" not in runtime:
                      continue
                  for entry in entries:
                      if entry.get("isAvailable"):
                          return entry["udid"]
              raise SystemExit("no available iOS simulator on this runner")

          try:
              udid = pick()
          except subprocess.TimeoutExpired:
              print("simctl hung; restarting CoreSimulator and retrying", file=sys.stderr)
              subprocess.run(["killall", "-9", "com.apple.CoreSimulator.CoreSimulatorService"],
                             capture_output=True)
              time.sleep(5)
              udid = pick()

          print(f"udid={udid}")
          print(f"simulator: {udid}", file=sys.stderr)
          PICK

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project PVM.xcodeproj -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      # PVMCoreTests belongs to the SwiftPM package, not to the Xcode project, so
      # `-only-testing:PVMCoreTests` cannot reach it — the scheme has never contained
      # it. Run it the way it is actually built, with `swift test`.
      #
      # This is not a repeat of the Linux job. The same sources run here against
      # Apple's Foundation instead of swift-corelibs-foundation, which is exactly where
      # the two have already diverged once in this project: the string-deallocation
      # crash in JSONSerialization was a Linux-only fault, and a Darwin-only fault
      # would be just as invisible from the other side.
      - name: Behaviour and safety tests (Apple Foundation)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          TZ: UTC
        run: |
          set -o pipefail
          swift test --package-path PVMCore | tee unit.log

      # `-maximum-test-execution-time-allowance` is a budget, not a nicety. A UI test
      # that waits on an element which will never appear does not fail — it waits, and
      # the whole suite then runs until the job timeout on a runner billed at ten times
      # the Linux rate. That happened: a query over `.any` element types took the step
      # from 4 minutes past 15 before it was cancelled by hand. Two minutes is generous
      # for a test whose slowest legitimate action is a screenshot.
      - name: Screenshots and screen descriptions
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project PVM.xcodeproj -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            -only-testing:PVMUITests \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 120 \
            | tee ui.log

      # stdout from inside the Simulator does not reach xcodebuild's log — that cost a
      # whole run on the T0-A sweep — so the files are collected off the runner's disk.
      - name: Collect what the app actually showed
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p screens
          find "$HOME/Library/Developer/CoreSimulator/Devices" \
               -name 'pvm-*.png' -newermt '-2 hours' -exec cp {} screens/ \; 2>/dev/null || true
          find "$HOME/Library/Developer/CoreSimulator/Devices" \
               -name 'pvm-*.txt' -newermt '-2 hours' -exec cp {} screens/ \; 2>/dev/null || true
          ls -la screens || true
          echo "===== WHAT THE APP SHOWED ====="
          for f in screens/*.txt; do
            [ -e "$f" ] || continue
            echo "--- $f ---"
            cat "$f"
          done
          if ! ls screens/*.png >/dev/null 2>&1; then
            echo "::warning::no screenshots were captured — the UI run produced nothing to look at"
          fi

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            ${{ env.PROJECT_DIR }}/build.log
            ${{ env.PROJECT_DIR }}/unit.log
            ${{ env.PROJECT_DIR }}/ui.log
            ${{ env.PROJECT_DIR }}/screens
          retention-days: 30
          if-no-files-found: warn

      # LAST, deliberately. This step existed before and sat in the middle, so its
      # output was buried under the artifact upload's forty lines of progress — and the
      # log viewer shows the end. Three separate runs were spent unable to read which
      # UI tests failed, on a runner billed at ten times the Linux rate.
      #
      # `if: always()` so it reports on a green run too: the screen text is the only way
      # this UI gets looked at from a machine with no Mac, and it is worth having when
      # everything passes as much as when it does not.
      - name: What failed, and what the app showed
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== UI TEST FAILURES ====="
          # The pattern list has to cover every way xcodebuild says something went
          # wrong, not just the two that had happened so far. On 2026-09-07 a run came
          # back FAILED with this section completely EMPTY: every assertion passed and
          # all six screens rendered, and the step failed some other way — a timeout, a
          # crash, a non-zero exit — none of which contains "error:" or
          # "XCTAssert...failed". A failure report that cannot describe the failure is
          # the fifth instance of one shape in this repository: the thing that reports
          # is never exercised by the thing it reports on.
          found=$(grep -E "error:|XCTAssert.*failed|Test Case .* failed|exceeded execution time allowance|Test session exited|Testing failed|Restarting after unexpected exit|crash" \
            ui.log unit.log build.log 2>/dev/null \
            | sed 's/.*photomanage\///' | sort -u | head -40 || true)
          if [ -n "$found" ]; then
            echo "$found"
          else
            # The backstop, and the point of this whole step: an unrecognised failure
            # mode must never again produce an empty report. If nothing matched, show
            # the raw end of the log and say why.
            echo "(nothing matched the known failure patterns — the raw tail follows)"
            for log in ui.log unit.log build.log; do
              [ -s "$log" ] || continue
              echo "--- last 25 lines of $log ---"
              tail -25 "$log" | sed 's/.*photomanage\///'
            done
          fi
          echo "===== WHAT THE APP SHOWED ====="
          for f in screens/*.txt; do
            [ -e "$f" ] || continue
            echo "--- $f ---"
            cat "$f"
          done
          echo "===== END ====="
