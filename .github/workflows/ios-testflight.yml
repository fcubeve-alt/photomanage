name: iOS archive + TestFlight upload

# Manual dispatch ONLY. This is the step that spends the $99 Apple Developer
# membership, so it never fires automatically on a push.
#
# Prerequisites (Owner, after a green ios-build.yml run — DEC-016 step 5/6):
#   APP_STORE_CONNECT_ISSUER_ID     APP_STORE_CONNECT_KEY_ID
#   APP_STORE_CONNECT_PRIVATE_KEY   (contents of the .p8)
#   BUILD_CERTIFICATE_BASE64        (distribution .p12, base64)
#   P12_PASSWORD                    PROVISIONING_PROFILE_BASE64
#   KEYCHAIN_PASSWORD               (any random string)
#   DEVELOPMENT_TEAM                (10-char Apple team id)

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'What changed in this build (shown in TestFlight)'
        required: false
        default: 'Tier 0-A benchmark harness'

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      XCODE_VERSION: '16.4'
      SCHEME: PVMBench
      PROJECT_DIR: 20_TIER0/harness
      BUNDLE_ID: com.pvm.bench

    steps:
      - uses: actions/checkout@v4

      - name: Fail early if secrets are missing
        run: |
          missing=0
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID \
                   APP_STORE_CONNECT_PRIVATE_KEY BUILD_CERTIFICATE_BASE64 \
                   P12_PASSWORD PROVISIONING_PROFILE_BASE64 KEYCHAIN_PASSWORD \
                   DEVELOPMENT_TEAM; do
            if [ -z "${!v}" ]; then echo "MISSING SECRET: $v"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "Add the secrets before dispatching."; exit 1; }
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      # Signing material lives in a throwaway keychain that exists only for this
      # job. The runner is destroyed afterwards, but being explicit is cheap.
      - name: Install signing certificate and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' \
            /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        # NOT pinned, and the comment here used to say it was — a second audit caught
        # that on 2026-09-12 and it was a plain false statement in the repository.
        # `brew install` takes whatever Homebrew ships that day, so a build that
        # worked on Monday can fail on Tuesday with nothing changed.
        #
        # Genuinely pinning it means downloading a tagged XcodeGen release and
        # checking its SHA-256, which needs a checksum nobody here can verify
        # offline. Until someone supplies one, this stays unpinned and says so; the
        # resolved version is recorded in the run summary, so when a build starts
        # failing for no reason anyone changed, the thing that moved is on the page.
        run: |
          brew install xcodegen
          # Recorded in the run summary so that when a build starts failing for no
          # reason anyone changed, the version that moved is on the page rather than
          # buried in a step log. Not a substitute for pinning.
          echo "XcodeGen: $(xcodegen --version | tr -d '\n')" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: xcodegen generate --spec project.yml

      - name: Archive
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PVMBench.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/PVMBench.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            | tee archive.log

      - name: Export .ipa
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PVMBench.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      # Small app, well inside the 500 MB Free-plan artifact limit. Kept short so
      # storage never becomes a surprise.
      - name: Upload .ipa as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PVMBench-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14
          if-no-files-found: warn

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f ~/.appstoreconnect/private_keys/*.p8 || true
