name: T0-A scale sweep (Simulator — NOT a device result)

# Answers one question at $0, while HG-1 is still open: what does one asset cost to
# index, and therefore how large a library fits the pre-registered §8 time budget?
#
# It runs the real pipeline (thumbnail decode -> dHash -> text likelihood -> OCR gate
# -> gated OCR -> feature print -> SQLite upsert with C-3 checkpoints) on the iOS
# Simulator. The Simulator has no thermal state, no battery, no jetsam and no Neural
# Engine, so this can produce an optimistic CEILING and can never produce an A1-A4
# device verdict (P-02, PF-01). The analyzer stamps that on every report it writes.
#
# Kept separate from ios-build.yml deliberately: that workflow must stay fast enough
# to run on every harness change, and this one is minutes of Vision work.

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: 'Corpus sizes to sweep, ascending, comma separated'
        default: '200,1000,3000'
      text_ratio:
        description: 'Fraction of the corpus that is text-bearing (drives the OCR gate ratio)'
        default: '0.25'
  push:
    paths:
      - '20_TIER0/harness/PVMBenchTests/ScaleBenchmarkTests.swift'
      - '20_TIER0/harness/analyze_scale.py'
      - '.github/workflows/t0a-scale.yml'

concurrency:
  group: t0a-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scale:
    runs-on: macos-15          # standard arm64 runner. Do NOT switch to -large/-xlarge.
    timeout-minutes: 45

    env:
      XCODE_VERSION: '16.4'
      SCHEME: PVMBench
      PROJECT_DIR: 20_TIER0/harness
      SIZES: ${{ github.event.inputs.sizes || '200,1000,3000' }}
      TEXT_RATIO: ${{ github.event.inputs.text_ratio || '0.25' }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      # Every analyzer is self-tested before it sees real data (MASTER_PLAN standing
      # checks). Two real bugs have already been caught this way.
      - name: Self-test the analyzer before it sees data
        run: python3 20_TIER0/harness/analyze_scale.py --selftest

      - name: Install XcodeGen
        # Pinned. An unpinned `brew install` takes whatever Homebrew ships that day,
        # so a build that worked on Monday can fail on Tuesday for a reason
        # nobody changed. XcodeGen generates the project every build, which
        # makes its version part of the build, not part of the environment.
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate --spec project.yml

      # Selection is by -only-testing, not by an environment flag: the first attempt
      # gated the sweep on TEST_RUNNER_PVM_SCALE_BENCH and came back green having
      # measured nothing. TEST_RUNNER_ is still used for the knobs, but every knob has
      # a working default, so a knob that fails to arrive costs a different corpus
      # size and never costs the measurement itself.
      - name: Run the scale sweep
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for rt,v in sorted(d.items(),reverse=True) if 'iOS' in rt for x in v if x.get('isAvailable')))")
          echo "simulator udid: $DEVICE  sizes: $SIZES  text ratio: $TEXT_RATIO"
          xcodebuild test \
            -project PVMBench.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -configuration Debug \
            -only-testing:PVMBenchTests/ScaleBenchmarkTests \
            CODE_SIGNING_ALLOWED=NO \
            TEST_RUNNER_PVM_SCALE_SIZES="$SIZES" \
            TEST_RUNNER_PVM_SCALE_TEXT_RATIO="$TEXT_RATIO" \
            | tee scale.log
          echo "SIMULATOR_UDID=$DEVICE" >> "$GITHUB_ENV"

      # stdout from inside the Simulator does not reach xcodebuild's log, so the
      # results are collected from the app container on the runner's own disk.
      - name: Collect results from the simulator container
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          FOUND=$(find "$HOME/Library/Developer/CoreSimulator/Devices" \
                    -name pvm_scale_results.txt -newermt '-2 hours' 2>/dev/null | head -1)
          if [ -z "$FOUND" ]; then
            echo "::error::pvm_scale_results.txt was never written — the sweep did not run."
            exit 1
          fi
          echo "results file: $FOUND"
          cp "$FOUND" scale_results.txt
          cat scale_results.txt
          grep -q "PVM_SCALE_RESULT " scale_results.txt || {
            echo "::error::the file exists but holds no measurements."
            exit 1
          }

      - name: Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 analyze_scale.py --log scale_results.txt --out T0A_SCALE_SIMULATOR.md
          cat T0A_SCALE_SIMULATOR.md >> "$GITHUB_STEP_SUMMARY"

      - name: Summarise errors
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== ERRORS ====="
          grep -E "error:" scale.log 2>/dev/null | sort -u | head -40 || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0a-scale
          path: |
            ${{ env.PROJECT_DIR }}/scale.log
            ${{ env.PROJECT_DIR }}/scale_results.txt
            ${{ env.PROJECT_DIR }}/T0A_SCALE_SIMULATOR.md
          retention-days: 30
          if-no-files-found: warn
