# XcodeGen spec for the app. Same pattern as the Tier 0 harness: a hand-written
# .pbxproj drifts and nobody notices, so the project is generated and CI is
# reproducible. Regenerate on a Mac with: xcodegen generate

name: PVM
options:
  bundleIdPrefix: com.pvm
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PVMCore:
    path: PVMCore

settings:
  base:
    SWIFT_VERSION: '5.0'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  PVM:
    type: application
    platform: iOS
    sources:
      - path: PVM
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pvm.app
        MARKETING_VERSION: '0.1'
        CURRENT_PROJECT_VERSION: '1'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: PVM/Info.plist
      properties:
        CFBundleDisplayName: Visual Library
        # Read access. Everything the product does starts here.
        NSPhotoLibraryUsageDescription: >-
          Reads the photos already on your phone so they can be catalogued and found
          again. Nothing is uploaded, no photo leaves this device, and this version
          never deletes or changes a photo.
        # NSPhotoLibraryAddUsageDescription is deliberately ABSENT.
        #
        # It was here, promising "removals go to Recently Deleted and stay undoable for
        # 30 days" — a claim about behaviour that has never been observed on a physical
        # device, made by a build that contains no `PHAssetChangeRequest` at all. An
        # unused usage-description string is not harmless: iOS shows it, so it is a
        # promise the product was making on its permission sheet and could not keep.
        #
        # It comes back when `LibrarySafety.mode` leaves `.readOnly`, and not before.
        UIBackgroundModes:
          - processing
        # C-4: BGProcessingTask must be declared here or scheduling silently fails.
        BGTaskSchedulerPermittedIdentifiers:
          - com.pvm.app.catalogue
    dependencies:
      - package: PVMCore
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: Vision.framework
      - sdk: BackgroundTasks.framework
      # Purchases go to Apple and nowhere else. `PVM.storekit` (next to this file) lets
      # the whole purchase / restore / cancel / refund path be exercised in the
      # Simulator with no developer account: Edit Scheme → Run → Options → StoreKit
      # Configuration.
      - sdk: StoreKit.framework
      - sdk: libsqlite3.tbd

  # Unit tests for the app layer — the half that `PVMCore` cannot reach because it
  # lives in the app target: the ingestion coordinator, the PhotoKit adapter, the
  # safety gate.
  #
  # This target exists because of a specific miss. A third-party audit found that the
  # depth pass ran on the main actor and froze the UI for minutes, and NOTHING in the
  # suite could have caught it: `PVMCore` has hundreds of tests and no access to this
  # code, and `PVMUITests` is a UI bundle in a separate process that cannot
  # `@testable import PVM`. There was no place to assert a property of the app layer,
  # so nobody asserted one.
  PVMTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PVMTests
    dependencies:
      - target: PVM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pvm.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PVM.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PVM"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO

  # Screenshots, so the UI can be looked at rather than imagined. The app is written on
  # a machine with no Mac and no iPhone; without this, "the UI is built" would rest on
  # the fact that it compiles.
  PVMUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PVMUITests
    dependencies:
      - target: PVM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pvm.app.uitests
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO

schemes:
  PVM:
    build:
      targets:
        PVM: all
        PVMTests: [test]
        PVMUITests: [test]
    test:
      targets:
        - PVMTests
        - PVMUITests
    run:
      config: Debug
